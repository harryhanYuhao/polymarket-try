[package]
name = "pm-try"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Small Polymarket CLI: active orders, prediction + perps positions, and perps take-profit / stop-loss management"
license = "MIT"
publish = false

[lib]
name = "pm_try"
path = "src/lib.rs"

[[bin]]
name = "pm"
path = "src/main.rs"

[dependencies]
alloy-primitives = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
comfy-table = "7"
dotenvy = "0.15"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
