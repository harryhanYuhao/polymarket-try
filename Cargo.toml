[package]
name = "polymarket-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A small CLI for Polymarket prediction-market and perpetuals APIs"
license = "MIT"

[lib]
name = "polymarket_cli"
path = "src/lib.rs"

[[bin]]
name = "pml"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
wiremock = "0.6"
